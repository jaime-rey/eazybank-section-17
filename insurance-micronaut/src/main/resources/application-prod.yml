datasources:
  default:
    url: jdbc:h2:mem:insurancedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    dialect: H2
    schema-generate: CREATE_DROP

jpa:
  default:
    entity-scan:
      packages: 'com.eazybytes.insurance.hexagonal.createpolicy.infrastructure.persistence'
    properties:
      hibernate:
        hbm2ddl:
          auto: update
        show_sql: true
        format_sql: true

kafka:
  bootstrap:
    servers: localhost:9092
