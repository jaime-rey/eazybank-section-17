# Perfil "integration" — usado por AccountsRepositoryIT (Testcontainers + MySQL real).
#
# Objetivo: aislar el @SpringBootTest de infra externa (config server, K8s discovery,
# Kafka real). El datasource lo inyecta @ServiceConnection desde el contenedor MySQL,
# no se define aquí.
spring:
  config:
    # No intentar traer config del configserver externo.
    import: "optional:configserver:"
  cloud:
    discovery:
      enabled: false           # sin Spring Cloud discovery
    kubernetes:
      discovery:
        enabled: false         # sin Kubernetes discovery
    function:
      definition: ""           # desactivar bindings de Spring Cloud Stream
    # El test binder se activa via @EnableTestBinder en el IT (spring-cloud-stream 5.x
    # ya no autorregistra el binder; no hay META-INF/spring.binders en el jar).
  jpa:
    hibernate:
      ddl-auto: none           # el schema lo pone schema.sql (fuente unica de verdad)
    properties:
      hibernate:
        generate_statistics: true
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
  sql:
    init:
      mode: always             # ejecutar schema.sql contra el MySQL del contenedor
