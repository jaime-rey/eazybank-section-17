# "integration" profile — used by AccountsRepositoryIT (Testcontainers + real MySQL).
#
# Goal: isolate the @SpringBootTest from external infra (config server, K8s discovery,
# real Kafka). The datasource is injected by @ServiceConnection from the MySQL
# container, so it is not defined here.
spring:
  config:
    # Do not try to pull config from the external configserver.
    import: "optional:configserver:"
  cloud:
    discovery:
      enabled: false           # no Spring Cloud discovery
    kubernetes:
      discovery:
        enabled: false         # no Kubernetes discovery
    function:
      definition: ""           # disable Spring Cloud Stream bindings
    # The test binder is activated via @EnableTestBinder on the IT (spring-cloud-stream 5.x
    # no longer auto-registers the binder; there is no META-INF/spring.binders in the jar).
  jpa:
    hibernate:
      ddl-auto: none           # the schema is provided by schema.sql (single source of truth)
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
  sql:
    init:
      mode: always             # run schema.sql against the container's MySQL
