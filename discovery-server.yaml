apiVersion: v1
kind: ServiceAccount
metadata:
  name: spring-cloud-kubernetes-discoveryserver
  labels:
    app: spring-cloud-kubernetes-discoveryserver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: namespace-reader
rules:
  - apiGroups: ["", "extensions", "apps"]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spring-cloud-kubernetes-discoveryserver:view
  labels:
    app: spring-cloud-kubernetes-discoveryserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: namespace-reader
subjects:
  - kind: ServiceAccount
    name: spring-cloud-kubernetes-discoveryserver
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-cloud-kubernetes-discoveryserver-deployment
  labels:
    app: spring-cloud-kubernetes-discoveryserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-cloud-kubernetes-discoveryserver
  template:
    metadata:
      labels:
        app: spring-cloud-kubernetes-discoveryserver
    spec:
      serviceAccountName: spring-cloud-kubernetes-discoveryserver
      containers:
        - name: spring-cloud-kubernetes-discoveryserver
          image: springcloud/spring-cloud-kubernetes-discoveryserver:3.0.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 100
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 100
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: spring-cloud-kubernetes-discoveryserver
  labels:
    app: spring-cloud-kubernetes-discoveryserver
spec:
  type: ClusterIP
  selector:
    app: spring-cloud-kubernetes-discoveryserver
  ports:
    - name: http
      port: 80
      targetPort: 8761
