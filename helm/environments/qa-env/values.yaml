global:
  configMapName: eazybankqa-configmap
  activeProfile: qa
  configServerURL: configserver:http://configserver:8071/
  discoveryServerURL: http://spring-cloud-kubernetes-discoveryserver.default.svc.cluster.local:80
  redisHost: redis.default.svc.cluster.local
  redisPort: "6379"
  h2Host: h2.default.svc.cluster.local
  h2Port: "1521"
  keyCloakURL: http://keycloak.default.svc.cluster.local:80/realms/master/protocol/openid-connect/certs
  openTelemetryJavaAgent: "-javaagent:/app/libs/opentelemetry-javaagent-2.22.0.jar"
  otelExporterEndPoint: http://tempo.default.svc.cluster.local:4318
  otelMetricsExporter: none
  otelLogsExporter: none
  kafkaBrokerURL: kafka-controller-0.kafka-controller-headless.default.svc.cluster.local:9092

# Override del gateway solo para qa: LoadBalancer en 8073 para no chocar con dev-env (8072).
# El contenedor sigue escuchando en 8072; solo cambia el puerto externo del Service.
gatewayserver:
  service:
    port: 8073