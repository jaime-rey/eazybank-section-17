apiVersion: apps/v1
kind: Deployment
metadata:
  name: h2
  labels:
    app: h2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: h2
  template:
    metadata:
      labels:
        app: h2
    spec:
      containers:
        - name: h2
          image: oscarfonts/h2:latest
          env:
            - name: H2_OPTIONS
              value: "-tcp -tcpAllowOthers -tcpPort 1521 -web -webAllowOthers -webPort 81 -ifNotExists"
          ports:
            - name: tcp
              containerPort: 1521
            - name: web
              containerPort: 81
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 1521
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: h2
  labels:
    app: h2
spec:
  type: ClusterIP
  selector:
    app: h2
  ports:
    - name: tcp
      port: 1521
      targetPort: 1521
    - name: web
      port: 81
      targetPort: 81
